name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy amacs/ benchmarks/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record interpreter
        run: python --version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pip install -e ".[dev,all-llm]" build
      - run: |
          python -m pytest tests/ -v \
            --cov=amacs --cov-report=term-missing \
            --cov-fail-under=85
      - name: Fixture benchmark
        run: make bench-fixture
      - name: Wheel packaging smoke test
        run: |
          python -m build
          python -m venv .venv_verify
          .venv_verify/bin/pip install dist/*.whl
          .venv_verify/bin/amacs --version
          .venv_verify/bin/amacs benchmark
          .venv_verify/bin/python examples/basic_usage.py

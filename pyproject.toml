[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amacs"
version = "0.2.0"
description = "Adaptive Multi-Agent Coordination System — add multi-agent AI coordination to any function with a single decorator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Aditya Padale", email = "adityapadale25@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["multi-agent", "ai", "coordination", "decorator", "llm", "orchestration"]

dependencies = [
    "tenacity>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
ollama = ["ollama>=0.1"]
gemini = ["google-genai>=1.0"]
groq = ["groq>=0.9"]
pinecone = ["pinecone-client>=3.0"]
faiss = ["faiss-cpu>=1.7"]
monitoring = ["prometheus-client>=0.17"]
all-llm = ["openai>=1.0", "anthropic>=0.20", "ollama>=0.1", "google-genai>=1.0", "groq>=0.9"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
amacs = "amacs.cli:main"

[project.urls]
Homepage = "https://github.com/Aditya-padale/amacs"
Documentation = "https://github.com/Aditya-padale/amacs/tree/main/docs"
Repository = "https://github.com/Aditya-padale/amacs"
Issues = "https://github.com/Aditya-padale/amacs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["amacs*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # Keep old typing for 3.9 compat
    "RUF022",  # __all__ sorting is subjective
    "PT011",   # pytest.raises too broad is fine for config tests
    "BLE001",  # blind exception catch is intentional in providers
]
